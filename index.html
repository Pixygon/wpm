<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wpm</title>
    <meta name="description" content="wpm — the Weft package registry: verified, content-addressed packages for the Thread. Like npm, but packages cannot lie." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://wpm.pixygon.io/" />

    <!-- Open Graph — the static baseline for no-JS crawlers; the prerender +
         @pixygon/seo <SEO> fill richer per-route values. Replace og-image.png
         with this project's own 1200×630 card. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wpm.pixygon.io/" />
    <meta property="og:title" content="wpm" />
    <meta property="og:description" content="wpm — the Weft package registry: verified, content-addressed packages for the Thread. Like npm, but packages cannot lie." />
    <meta property="og:image" content="https://wpm.pixygon.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="wpm" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="wpm" />
    <meta name="twitter:description" content="wpm — the Weft package registry: verified, content-addressed packages for the Thread. Like npm, but packages cannot lie." />
    <meta name="twitter:image" content="https://wpm.pixygon.io/og-image.png" />
    <meta name="twitter:site" content="@Pixygon" />

    <!-- Pixygon identity graph (single source: @pixygon/seo PIXYGON_SAME_AS) —
         so Google reads the whole estate as one entity. Keep in sync with the
         package if the social set changes. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://pixygon.io/#organization",
        "name": "Pixygon",
        "url": "https://pixygon.io",
        "logo": "https://pixygontech.b-cdn.net/PixygonLogo512.png",
        "founder": { "@type": "Person", "name": "Anders Oneiros" },
        "address": { "@type": "PostalAddress", "addressLocality": "Eidsvoll", "addressRegion": "Akershus", "addressCountry": "NO" },
        "sameAs": [
          "https://x.com/Pixygon",
          "https://www.linkedin.com/company/pixygon/",
          "https://www.youtube.com/@PixygonGames",
          "https://www.instagram.com/pixygon_",
          "https://www.facebook.com/profile.php?id=100086281141146",
          "https://github.com/Pixygon"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
